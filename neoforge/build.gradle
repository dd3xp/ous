plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets.main.resources.srcDir('src/main/generated/resources')

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
    
    runs {
        datagen {
            data()
            programArg '--all'
            programArg '--mod'
            programArg 'ous'
            programArg '--output'
            programArg file("src/main/generated/resources").absolutePath
            programArg '--existing'
            programArg file("${project(':common').projectDir}/src/main/resources").absolutePath
            programArg '--existing'
            programArg file("src/main/resources").absolutePath
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // 本项目写了兼容插件的三个 mod（compat/jade、compat/wthit、compat/jei）。
    // 每个都成对声明：-api 包供编译，完整包供开发环境运行时加载，版本号一处定义，
    // 保证编译的 API 与运行的实现永远一致。
    //
    // 不要改成「把发布版 jar 丢进 neoforge/run/mods」——那样绕过 Loom remap，拿不到
    // refmap。Jade 会因此在标题界面崩溃：其 StringRenderOutputMixin @Shadow 了内部类
    // 的合成字段 this$0，而开发环境的 Minecraft jar 里根本没有这个字段名
    // (InvalidMixinException: @Shadow field this$0 was not located ... No refMap loaded)。
    // 其余 mod 当时侥幸没崩，但那只是碰巧，不是保证。
    // run/mods 只放整合包里项目代码不引用的那些 mod。
    modCompileOnly "mcp.mobius.waila:wthit-api:neo-${rootProject.wthit_version}"
    modLocalRuntime "mcp.mobius.waila:wthit:neo-${rootProject.wthit_version}"

    modCompileOnly "maven.modrinth:jade:$rootProject.jade_version"
    modLocalRuntime "maven.modrinth:jade:$rootProject.jade_version"

    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-neoforge-api:${rootProject.jei_version}"
    modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'minecraft_version_range', rootProject.minecraft_version_range
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'loader_version_range', rootProject.loader_version_range
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'mod_version', project.version
    inputs.property 'mod_authors', rootProject.mod_authors
    inputs.property 'mod_description', rootProject.mod_description

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version,
            minecraft_version: rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version: rootProject.neoforge_version,
            loader_version_range: rootProject.loader_version_range,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_version: project.version,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json', '.cache/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
