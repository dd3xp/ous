plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets.main.resources.srcDir('src/main/generated/resources')

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
    
    runs {
        datagen {
            data()
            programArg '--all'
            programArg '--mod'
            programArg 'ous'
            programArg '--output'
            programArg file("src/main/generated/resources").absolutePath
            programArg '--existing'
            programArg file("${project(':common').projectDir}/src/main/resources").absolutePath
            programArg '--existing'
            programArg file("src/main/resources").absolutePath
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Optional WTHIT/Jade/JEI support — 版本与 neoforge/run/mods 里整合包自带的 jar 对齐。
    // WTHIT / JEI 的完整 mod 由 run/mods 里的 jar 提供，这里只要 API。
    modCompileOnly "mcp.mobius.waila:wthit-api:neo-12.8.3"

    // Jade 必须走 modLocalRuntime，不能丢 jar 到 run/mods：
    // 它的 StringRenderOutputMixin @Shadow 了内部类的合成字段 this$0，需要 refmap 重映射，
    // 而开发环境只对 Loom remap 过的 mod 加载 refmap。直接放原始 jar 会在标题界面崩溃
    // (InvalidMixinException: @Shadow field this$0 was not located ... No refMap loaded)。
    // 因此 run/mods 里不要放 Jade-*.jar，由下面这行提供。
    modCompileOnly "maven.modrinth:jade:15.10.3+neoforge"
    modLocalRuntime "maven.modrinth:jade:15.10.3+neoforge"

    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-neoforge-api:${rootProject.jei_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'minecraft_version_range', rootProject.minecraft_version_range
    inputs.property 'neoforge_version', rootProject.neoforge_version
    inputs.property 'loader_version_range', rootProject.loader_version_range
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'mod_version', project.version
    inputs.property 'mod_authors', rootProject.mod_authors
    inputs.property 'mod_description', rootProject.mod_description

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            version: project.version,
            minecraft_version: rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version: rootProject.neoforge_version,
            loader_version_range: rootProject.loader_version_range,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_license: rootProject.mod_license,
            mod_version: project.version,
            mod_authors: rootProject.mod_authors,
            mod_description: rootProject.mod_description
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'architectury.common.json', '.cache/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
